px;background:#62b73c;border:2px solid #2d671b;border-radius:6px;z-index:8}.quake{position:absolute;border:4px solid #ff3030;border-radius:50%;z-index:4;pointer-events:none;transform:translate(-50%,-50%);animation:quake .7s ease-out forwards;box-shadow:0 0 14px #ff3030;overflow:visible}.quakeInner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px dashed #ff6b35;border-radius:50%;opacity:.8;animation:quakeInner .7s ease-out forwards}.quakeCrack{position:absolute;left:50%;top:50%;width:3px;background:linear-gradient(#fff0,#ff493b,#fff0);transform-origin:center bottom;opacity:.85;animation:crack .7s ease-out forwards;box-shadow:0 0 5px #ff3030}.quakeMsg{position:absolute;z-index:25;pointer-events:none;font-size:11px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 1px 4px #000;transform:translate(-50%,-50%);animation:quakeMsg 1s ease-out forwards}@keyframes quakeMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}@keyframes quake{0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}@keyframes quakeInner{0%{opacity:.9;transform:translate(-50%,-50%) scale(.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}@keyframes crack{0%{opacity:0;transform-origin:center bottom;transform:rotate(0deg) translateY(-8px) scaleY(.2)}20%{opacity:.95}100%{opacity:0;transform:rotate(0deg) translateY(-8px) scaleY(1)}}.info{width:min(82vw,400px);margin:auto;display:grid;gap:6px}.row{background:#202633;border-radius:9px;padding:7px 9px;text-align:left}.row b{display:inline-block;width:72px}.cool{font-size:12px;color:#cbd5e1}.hpnum{font-size:12px;color:#86efac;margin-left:8px;font-weight:800}.win{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}.win .name{font-size:38px;font-  if(f.n==='푸바오'){if(f.isBoss){f.cool-=dt;if(f.cool<=0){let enemies=alive().filter(e=>e!==f).sort((a,b)=>dist(f,a)-dist(f,b));enemies.slice(0,4).forEach((e,i)=>{let q=Math.hypot(e.x-f.x,e.y-f.y)||1;shots.push({o:f,x:f.x,y:f.y,e:null,s:5,d:45+(i===0?5:0),vx:(e.x-f.x)/q*5,vy:(e.y-f.y)/q*5,kind:'bamboo',special:i===0});});f.cool=4-(mode==='raid'&&!f.isBoss&&f.hp<=50?1:0)}}else{if(f.state==='charge'){f.charge-=dt;if(f.charge<=0){let e=(mode==='raid'&&f.team==='raid'?alive().find(x=>x.isBoss):null)||enemy(f);if(e){let q=Math.hypot(e.x-f.x,e.y-f.y)||1;shots.push({o:f,x:f.x,y:f.y,e:null,s:5,d:45,vx:(e.x-f.x)/q*5,vy:(e.y-f.y)/q*5,kind:'bamboo'})}f.state='';f.cool=4-(mode==='raid'&&!f.isBoss&&f.hp<=50?1:0);f.vx=f.preVx||f.spd;f.vy=f.preVy||0}return}f.cool-=dt;if(f.cool<=0){f.state='charge';f.charge=1;f.preVx=f.vx;f.preVy=f.vy;f.vx=0;f.vy=0}}}
 if(f.n==='이영웅'){f.cool-=dt;if(f.cool<=0){let e=(mode==='raid'&&f.team==='raid'?alive().find(x=>x.isBoss):null)||enemy(f);if(e){let extraMsgShown=false;while(true){let d=15+Math.floor(Math.pow(Math.random(),1.25)*36),q=Math.hypot(e.x-f.x,e.y-f.y)||1;let count=f.isBoss?2:1;for(let k=0;k<count;k++)shots.push({o:f,x:f.x,y:f.y,e:e,s:5,d,vx:(e.x-f.x)/q*5,vy:(e.y-f.y)/q*5,kind:'support'});if(!(f.isBoss&&d>=25&&d<=35))break;if(!extraMsgShown){extraMsgShown=true;if(f.msgEl)f.msgEl.remove();let m=document.createElement('div');m.className='quakeMsg';m.textContent='한번 더!';m.style.left=f.x+'px';m.style.top=(f.y-38)+'px';arena.appendChild(m);f.msgEl=m;setTimeout(()=>{if(f.msgEl===m){m.remove();f.msgEl=null}},900)}}f.cool=4-(mode==='raid'&&!f.isBoss&&f.hp<=50?1:0)}}}
 if(f.n==='각성한 조우진'){f.cool-=dt;if(f.jump>0)f.jump-=dt;if(f.cool<=0){const radius=Math.min(w,h)*0.666666;for(const e of alive())if(e!==f&&(mode!=='raid'||e.team!==f.team)){const d=dist(f,e);if(d<=radius){const ratio=d/radius;let dmg;if(ratio<=0.20)dmg=50;else if(ratio<=0.45)dmg=40;else if(ratio<=0.70)dmg=25;else dmg=10;damage(e,dmg+(f.isBoss?10:0));e.slow=f.isBoss?3.0:1.2;e.slowFactor=.45}}quakes.push({x:f.x,y:f.y,r:radius,life:.9,maxLife:.9});f.jump=.65;f.cool=4.5-(mode==='raid'&&!f.isBoss&&f.hp<=50?1:0);f.quakeMsg=1;if(f.msgEl)f.msgEl.remove();let m=document.createElement('div');m.className='quakeMsg';m.textContent=f.isBoss?'강도 5 전역 지진 발사!!':'강도 5 지진 발사!!';m.style.left=f.x+'px';m.style.top=(f.y-38)+'px';arena.appendChild(m);f.msgEl=m;setTimeout(()=>{if(f.msgEl===m){m.remove();f.msgEl=null;f.quakeMsg=0}},900)}}
 if(f.n==='최시윤'){f.cool-=dt;if(f.cool<=0){let count=f.isBoss?4:1;for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2;chocos.push({o:f,x:f.x,y:f.y,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,boss:!!f.isBoss})}f.cool=4-(mode==='raid'&&!f.isBoss&&f.hp<=50?1:0)}}
 if(f.n==='박대건'){
   f.handSpeedTimer+=dt;

   f.skillFxTimer-=dt;

 }
}
function loop(now){if(!running)return;let realDt=Math.min(.05,(now-last)/1000);last=now;let dt=Math.min(.2,realDt*gameSpeed);w=arena.clientWidth,h=arena.clientHeight;F.forEach(f=>{if(f.alive){if(f.slow>0){f.slow-=dt;if(f.slow<=0){f.slow=0;f.slowFactor=1}}skills(f,dt)}});F.forEach(f=>{if(!f.alive||f.state==='charge')return;f.x+=f.vx*60*dt*f.slowFactor;f.y+=f.vy*60*dt*f.slowFactor;if(f.x<20||f.x>w-20)f.vx*=-1;if(f.y<20||f.y>h-20)f.vy*=-1;f.x=Math.max(20,Math.min(w-20,f.x));f.y=Math.max(20,Math.min(h-20,f.y))});
 for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){let a=F[i],b=F[j];if(!a.alive||!b.alive)continue;if((a.state==='charge'||b.state==='charge'))continue;if(dist(a,b)<40){let d=dist(a,b)||1;let nx=(b.x-a.x)/d,ny=(b.y-a.y)/d;let overlap=40-d;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let aRage=a.n==='조우진'&&a.state==='rage',bRage=b.n==='조우진'&&b.state==='rage';let aSpeed=Math.hypot(a.vx,a.vy),bSpeed=Math.hypot(b.vx,b.vy);let rvx=b.vx-a.vx,rvy=b.vy-a.vy;let rel=rvx*nx+rvy*ny;if(rel<0){a.vx+=rel*nx;a.vy+=rel*ny;b.vx-=rel*nx;b.vy-=rel*ny}if(aRage&&aSpeed>0){let s=Math.hypot(a.vx,a.vy)||1;a.vx*=aSpeed/s;a.vy*=aSpeed/s}if(bRage&&bSpeed>0){let s=Math.hypot(b.vx,b.vy)||1;b.vx*=bSpeed/s;b.vy*=bSpeed/s}if(aRage&& (mode!=='raid'||a.team!==b.team))damage(b,a.dmg);if(bRage&& (mode!=='raid'||a.team!==b.team))damage(a,b.dmg);for(let z of [a,b]){if(z.n==='조우진'&&z.state==='rage'&&!z.isBoss){let other=z===a?b:a;let shouldEnd=mode!=='raid'||other.isBoss;if(shouldEnd){z.state='';z.cool=3-(mode==='raid'&&!z.isBoss&&z.hp<=50?1:0);z.dmg=9;z.vx/=1.75;z.vy/=1.75;z.el.style.background=T[z.n].c;z.el.style.boxShadow='0 3px 8px #0008'}}}}}
 shots.forEach(p=>{if(p.kind==='support'&&p.e&&p.e.alive){let q=Math.hypot(p.e.x-p.x,p.e.y-p.y)||1;let targetVx=(p.e.x-p.x)/q*p.s,targetVy=(p.e.y-p.y)/q*p.s;p.vx+=(targetVx-p.vx)*Math.min(1,7*dt);p.vy+=(targetVy-p.vy)*Math.min(1,7*dt);let sp=Math.hypot(p.vx,p.vy)||1;p.vx=p.vx/sp*p.s;p.vy=p.vy/sp*p.s}p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;let hit=F.find(e=>e.alive&&e!==p.o&&(mode!=='raid'||e.team!==p.o.team)&&Math.hypot(e.x-p.x,e.y-p.y)<18);if(hit){damage(hit,p.d+(p.o.isBoss?10:0));p.dead=1}else if(p.x<0||p.x>w||p.y<0||p.y>h)p.dead=1});shots=shots.filter(p=>!p.dead);
 chocos.forEach(c=>{c.x+=c.vx*60*dt;c.y+=c.vy*60*dt;let r=8;if(c.x<r){c.x=r;c.vx=Math.abs(c.vx)}if(c.x>arena.clientWidth-r){c.x=arena.clientWidth-r;c.vx=-Math.abs(c.vx)}if(c.y<r){c.y=r;c.vy=Math.abs(c.vy)}if(c.y>arena.clientHeight-r){c.y=arena.clientHeight-r;c.vy=-Math.abs(c.vy)}for(let e of alive())if(e!==c.o&&(mode!=='raid'||e.team!==c.o.team)&&dist(c,e)<(c.boss?30:26)){damage(e,15+(c.o.isBoss?10:0));c.o.hp=Math.min(c.o.maxHp,c.o.hp+(c.o.isBoss?10:5));c.dead=1}});chocos=chocos.filter(c=>!c.dead);quakes.forEach(q=>q.life-=dt);quakes=quakes.filter(q=>q.life>0);
handFx.forEach(x=>{
  x.life-=dt;x.phase+=x.o.handSpeed*dt*2.2;
  let amp=16+Math.min(24,x.o.handSpeed*2),dy=Math.sin(x.phase)*amp;
  let handPts=[{x:x.o.x-50,y:x.o.y+dy},{x:x.o.x+50,y:x.o.y+dy}];
  for(let e of alive()){
    if(e===x.o)continue;
    if(mode==='raid'&&x.o.team==='raid'&&!e.isBoss)continue;
    let touching=handPts.some(pt=>Math.hypot(e.x-pt.x,e.y-pt.y)<22);
    if(touching){
      if(!x.hit)x.hit=new Map();
      let timer=x.hit.get(e);
      if(timer===undefined||timer<=0){
        let baseDamage=x.o.isBoss?30:20;let speedBonus=Math.max(0,Math.floor(x.o.handSpeed-0.5));damage(e,baseDamage+speedBonus);
        x.hit.set(e,2.0);

      e.slow=1.5;e.slowFactor=.5;
    }else if(x.hit)x.hit.delete(e);
  }
});
handFx=handFx.filter(x=>x.life>0&&x.o.alive);
bossHandFx.forEach(x=>{
  x.life-=dt;
  let bw=arena.clientWidth,bh=arena.clientHeight;
  let handPts=[{x:37,y:32},{x:37,y:bh-38},{x:bw-37,y:32},{x:bw-37,y:bh-38}];

    if(e===x.o)continue;

      let timer=x.hit.get(e);
      if(timer===undefined||timer<=0){damage(e,2);x.hit.set(e,1.0)}else x.hit.set(e,Math.max(0,timer-dt));
      e.slow=1.5;e.slowFactor=.5;
    }else if(x.hit)x.hit.delete(e);

});
bossHandFx=bossHandFx.filter(x=>x.life>0&&x.o.alive);
render();if(mode==='raid'){let boss=F.find(f=>f.isBoss&&f.alive),raiders=F.some(f=>f.team==='raid'&&f.alive);if(!boss||!raiders){running=false;winner.textContent=boss?'👑 '+boss.n+' (보스)':'⚔️ 레이드 팀';win.style.display='flex';return}}else if(alive().length<=1){running=false;winner.textContent=alive()[0]?alive()[0].n:'무승부';win.style.display='flex';return}requestAnimationFrame(loop)}
function render(){F.forEach(f=>{if(!f.alive)return;f.el.style.left=f.x+'px';f.el.style.top=f.y+'px';f.el.style.transform=(f.n==='각성한 조우진'&&f.jump>0)?`translate(-50%,-50%) translateY(${-Math.sin((.65-f.jump)/.65*Math.PI)*12}px) scale(1.04)`:'translate(-50%,-50%)';f.hpEl.style.left=f.x+'px';f.hpEl.style.top=(f.y-26)+'px';f.hpEl.innerHTML=`<i style="width:${f.hp}%"></i>`;f.el.style.backgroundImage=`url('${BALL_IMAGES[f.n]}')`;f.el.style.backgroundSize='cover';f.el.style.backgroundPosition='center';let r=document.getElementById('r'+f.n);if(r)r.querySelector('.cool').textContent=f.state==='rage'?(f.isBoss?'분노 '+f.dmg+'공격력 · 남은 '+Math.max(0,f.bossRageTime).toFixed(1)+'초':'분노 '+f.dmg+'공격력 · 다음 강화 '+Math.max(0,f.cool).toFixed(1)+'초 · 적에게 닿으면 종료'):f.n==='각성한 조우진'?'지진 스킬 '+Math.max(0,f.cool).toFixed(1)+'초':f.n==='박대건'?'67 손 스킬 · 이동속도 '+f.handSpeed.toFixed(1):f.state==='charge'?'시전 중 '+Math.max(0,f.charge).toFixed(1)+'초':'스킬 '+Math.max(0,f.cool).toFixed(1)+'초';if(r)r.querySelector('.hpnum').textContent=(f.isBoss?'BOSS HP ':'HP ')+Math.max(0,Math.ceil(f.hp))+'/'+f.maxHp});arena.querySelectorAll('.choco,.bamboo,.quake,.handSkill,.bossHands').forEach(e=>e.remove());chocos.forEach(c=>{let e=document.createElement('div');e.className='choco';let sz=c.boss?24:16;e.style.width=sz+'px';e.style.height=sz+'px';e.style.left=(c.x-sz/2)+'px';e.style.top=(c.y-sz/2)+'px';e.style.fontSize=(c.boss?'18px':'12px');e.textContent='🍫';arena.appendChild(e)});quakes.forEach(q=>{let e=document.createElement('div');e.className='quake';e.style.width=(q.r*2)+'px';e.style.height=(q.r*2)+'px';e.style.left=q.x+'px';e.style.top=q.y+'px';const progress=1-q.life/q.maxLife;e.style.opacity=(.95*(q.life/q.maxLife));e.style.transform=`translate(-50%,-50%) scale(${Math.max(.15,progress)})`;for(let i=0;i<12;i++){let c=document.createElement('i');c.className='quakeCrack';c.style.transform=`rotate(${i*30+8}deg) translateY(${-q.r*.48}px)`;c.style.height=(q.r*.9)+'px';c.style.width='4px';c.style.opacity=.95;e.appendChild(c)}let inner=document.createElement('div');inner.className='quakeInner';inner.style.width=(q.r*1.35)+'px';inner.style.height=(q.r*1.35)+'px';e.appendChild(inner);arena.appendChild(e)});handFx.forEach(x=>{
 let o=x.o,e=document.createElement('div');e.className='handSkill';
 let amp=16+Math.min(24,o.handSpeed*2),dy=Math.sin(x.phase)*amp;

 e.style.opacity=Math.min(1,x.life<.5?x.life/.5:1);arena.appendChild(e)
});
bossHandFx.forEach(x=>{
 let w=arena.clientWidth,h=arena.clientHeight;
 [[4,4,'6'],[4,h-70,'6'],[w-90,4,'7'],[w-90,h-70,'7']].forEach(a=>{

shots.forEach(p=>{let e=document.createElement('div');e.className=p.kind==='support'?'bamboo supportShot':'bamboo';if(p.kind==='support'){e.style.width='18px';e.style.height='18px';e.style.borderRadius='50%';e.style.background='#3b82f6';e.style.border='2px solid #bfdbfe';e.style.boxShadow='0 0 8px #60a5fa';e.style.left=(p.x-9)+'px';e.style.top=(p.y-9)+'px'}else{e.style.left=(p.x-22)+'px';e.style.top=(p.y-4)+'px';if(p.special){e.style.background='#facc15';e.style.borderColor='#fef08a';e.style.boxShadow='0 0 10px #fde047'}}arena.appendChild(e)})}
